name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-all-mods:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # --- KONFIGURACJA I BUDOWANIE MODA 1.21.1 ---
    - name: Setup Gradle for Mod 1.21.1
      uses: gradle/actions/setup-gradle@v4
      with:
        build-root-directory: ./mod-1.21.1

    - name: Build Mod 1.21.1
      run: ./gradlew build
      working-directory: ./mod-1.21.1

    # --- KONFIGURACJA I BUDOWANIE MODA 1.21.11 ---
    - name: Setup Gradle for Mod 1.21.11
      uses: gradle/actions/setup-gradle@v4
      with:
        build-root-directory: ./mod-1.21.11

    - name: Build Mod 1.21.11
      run: ./gradlew build
      working-directory: ./mod-1.21.11
